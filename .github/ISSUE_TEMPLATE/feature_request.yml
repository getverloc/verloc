name: Feature Request
description: Propose a new capability, provider format, routing policy, or dashboard improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What workflow or operational problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you envision this working (API surface, config, or dashboard UX).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative designs you considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gateway / Routing / Inference
        - Embedded Dashboard
        - Auth / Access Control / Analytics
        - Installer / Docker / Operations
        - Documentation
