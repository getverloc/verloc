name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: catalog generator regressions
        run: node --test scripts/sync-model-details.test.mjs
      - name: dashboard dependencies (locked)
        working-directory: dashboard
        run: npm ci
      - name: dashboard lint
        working-directory: dashboard
        run: npm run lint
      - name: dashboard regressions
        working-directory: dashboard
        run: npm test
      - name: dashboard type-check and embed build
        working-directory: dashboard
        run: npm run build
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./... -count=1
      - name: build (CGO off — the shipping configuration)
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/verloc ./cmd/verloc
      - name: benchmarks compile and run (smoke)
        run: go test ./internal/server/ -short -run='^$' -bench='EndToEndStream100KB' -benchtime=10x -count=1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: verify Docker image builds cleanly
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
